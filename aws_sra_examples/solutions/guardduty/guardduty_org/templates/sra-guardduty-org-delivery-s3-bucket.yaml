AWSTemplateFormatVersion: 2010-09-09
Description:
  This template creates the GuardDuty delivery S3 bucket - 'guardduty_org' solution in the repo,
  https://github.com/aws-samples/aws-security-reference-architecture-examples (sra-1ssgnse4k)

Metadata:
  SRA:
    Version: 1.1
    Order: 5
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Properties
        Parameters:
          - pSRASolutionName

      - Label:
          default: GuardDuty Delivery S3 Properties
        Parameters:
          - pGuardDutyOrgDeliveryBucketPrefix
          - pGuardDutyOrgDeliveryKMSKeyArn
          - pDelegatedAdminAccountId

    ParameterLabels:
      pGuardDutyOrgDeliveryBucketPrefix:
        default: GuardDuty Delivery Bucket Prefix
      pGuardDutyOrgDeliveryKMSKeyArn:
        default: GuardDuty Delivery KMS Key
      pDelegatedAdminAccountId:
        default: GuardDuty Delegated Admin Account ID
      pSRASolutionName:
        default: SRA Solution Name

Parameters:
  pGuardDutyOrgDeliveryBucketPrefix:
    AllowedPattern: '^$|^[0-9a-zA-Z]+([0-9a-zA-Z-]*[0-9a-zA-Z])*$'
    ConstraintDescription:
      S3 bucket name can include numbers, lowercase letters, uppercase letters, and hyphens (-). It cannot start or end with a hyphen (-).
    Default: sra-guardduty-org-delivery
    Description:
      GuardDuty Delivery S3 bucket prefix. The account and region will get added to the end. e.g. sra-guardduty-delivery-123456789012-us-east-1
    Type: String
  pGuardDutyOrgDeliveryKMSKeyArn:
    AllowedPattern: '^arn:(aws[a-zA-Z-]*)?:kms:[a-z0-9-]+:\d{12}:key\/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
    ConstraintDescription: 'Key ARN example:  arn:aws:kms:us-east-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab'
    Description: KMS Key ARN to use for encrypting GuardDuty findings sent to S3
    Type: String
  pDelegatedAdminAccountId:
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be 12 digits
    Description: GuardDuty Delegated Admin Account ID (the AWS account that owns the GuardDuty publishing destination/detectors allowed to write to this bucket).
    Type: String
  pSRASolutionName:
    AllowedValues: [sra-guardduty-org]
    Default: sra-guardduty-org
    Description: The SRA solution name. The default value is the folder name of the solution
    Type: String

Resources:
  rGuardDutyDeliveryS3Bucket:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::S3::Bucket
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: S3 access logging is not enabled.
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: S3 access logging is not enabled.
    Properties:
      BucketName: !Sub ${pGuardDutyOrgDeliveryBucketPrefix}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !Ref pGuardDutyOrgDeliveryKMSKeyArn
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: True
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: sra-solution
          Value: !Ref pSRASolutionName

  rGuardDutyDeliveryS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref rGuardDutyDeliveryS3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyPutObjectUnlessGuardDutyDelegatedAdmin
            # Explicit Deny for any s3:PutObject that is neither (a) made by an AWS service principal
            # on behalf of the GuardDuty delegated-admin account (aws:SourceAccount matches), nor
            # (b) made by an IAM principal in this (Log Archive) account (aws:PrincipalAccount matches).
            # Replaces the ineffective aws:CalledVia-based Deny, which did not fire for GuardDuty
            # service-principal requests (aws:CalledVia is not populated on service-principal calls).
            Effect: Deny
            Action: s3:PutObject
            Resource:
              - !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}
              - !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}/*
            Principal: '*'
            Condition:
              # Each ...IfExists key is true when the key is absent OR its value does not match.
              # Deny fires only when BOTH keys are non-matching, so a request from the delegated
              # admin (service principal with aws:SourceAccount set) or from a principal in this
              # account (aws:PrincipalAccount set) is allowed through to other statements.
              StringNotEqualsIfExists:
                aws:SourceAccount: !Ref pDelegatedAdminAccountId
                aws:PrincipalAccount: !Ref AWS::AccountId

          - Sid: SecureTransport
            Effect: Deny
            Action: 's3:*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
            Resource:
              - !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}
              - !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}/*
            Principal: '*'

          - Sid: AWSBucketPermissionsCheck
            Effect: Allow
            Action:
              - s3:GetBucketAcl
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}
            Principal:
              Service:
                - guardduty.amazonaws.com
                - guardduty.af-south-1.amazonaws.com
                - guardduty.ap-east-1.amazonaws.com
                - guardduty.ap-south-2.amazonaws.com
                - guardduty.ap-southeast-3.amazonaws.com
                - guardduty.ap-southeast-4.amazonaws.com
                - guardduty.ca-west-1.amazonaws.com
                - guardduty.eu-south-1.amazonaws.com
                - guardduty.eu-south-2.amazonaws.com
                - guardduty.eu-central-2.amazonaws.com
                - guardduty.me-south-1.amazonaws.com
                - guardduty.me-central-1.amazonaws.com
                - guardduty.il-central-1.amazonaws.com
            # Scope the GuardDuty service principal to the delegated-admin account's detectors to
            # prevent a cross-account confused-deputy (GuardDuty in a foreign account cannot pass
            # its own pre-flight permission check against this bucket).
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref pDelegatedAdminAccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:guardduty:*:${pDelegatedAdminAccountId}:detector/*

          - Sid: AWSBucketDelivery
            Effect: Allow
            Action: s3:PutObject
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref pDelegatedAdminAccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:guardduty:*:${pDelegatedAdminAccountId}:detector/*
            # Not narrowed to AWSLogs/<account-id>/*: CreatePublishingDestination and
            # UpdatePublishingDestination validate access by writing a test object named "AWSLogs/".
            # aws:SourceAccount and aws:SourceArn above restrict writes to the delegated admin's detectors.
            Resource: !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}/*
            Principal:
              Service:
                - guardduty.amazonaws.com
                - guardduty.af-south-1.amazonaws.com
                - guardduty.ap-east-1.amazonaws.com
                - guardduty.ap-south-2.amazonaws.com
                - guardduty.ap-southeast-3.amazonaws.com
                - guardduty.ap-southeast-4.amazonaws.com
                - guardduty.ca-west-1.amazonaws.com
                - guardduty.eu-south-1.amazonaws.com
                - guardduty.eu-south-2.amazonaws.com
                - guardduty.eu-central-2.amazonaws.com
                - guardduty.me-south-1.amazonaws.com
                - guardduty.me-central-1.amazonaws.com
                - guardduty.il-central-1.amazonaws.com

          - Sid: DenyUnencryptedObjectUploads
            Effect: Deny
            Action: s3:PutObject
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
            Resource: !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}/*
            Principal:
              Service:
                - guardduty.amazonaws.com
                - guardduty.af-south-1.amazonaws.com
                - guardduty.ap-east-1.amazonaws.com
                - guardduty.ap-south-2.amazonaws.com
                - guardduty.ap-southeast-3.amazonaws.com
                - guardduty.ap-southeast-4.amazonaws.com
                - guardduty.ca-west-1.amazonaws.com
                - guardduty.eu-south-1.amazonaws.com
                - guardduty.eu-south-2.amazonaws.com
                - guardduty.eu-central-2.amazonaws.com
                - guardduty.me-south-1.amazonaws.com
                - guardduty.me-central-1.amazonaws.com
                - guardduty.il-central-1.amazonaws.com

          - Sid: DenyIncorrectEncryptionHeader
            Effect: Deny
            Action: s3:PutObject
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !Sub ${pGuardDutyOrgDeliveryKMSKeyArn}
            Resource: !Sub arn:aws:s3:::${rGuardDutyDeliveryS3Bucket}/*
            Principal:
              Service:
                - guardduty.amazonaws.com
                - guardduty.af-south-1.amazonaws.com
                - guardduty.ap-east-1.amazonaws.com
                - guardduty.ap-south-2.amazonaws.com
                - guardduty.ap-southeast-3.amazonaws.com
                - guardduty.ap-southeast-4.amazonaws.com
                - guardduty.ca-west-1.amazonaws.com
                - guardduty.eu-south-1.amazonaws.com
                - guardduty.eu-south-2.amazonaws.com
                - guardduty.eu-central-2.amazonaws.com
                - guardduty.me-south-1.amazonaws.com
                - guardduty.me-central-1.amazonaws.com
                - guardduty.il-central-1.amazonaws.com


Outputs:
  oGuardDutyDeliveryS3Bucket:
    Description: SRA GuardDuty Delivery S3 Bucket
    Value: !Ref rGuardDutyDeliveryS3Bucket
