[tool.poetry]
name = "aws_sra_examples"
version = "2.1.8"
description = "AWS Security Reference Architecture Examples"
authors = ["Amazon Web Services <no_reply@amazon.com>"]
license = "MIT-0 License"

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.35.0"
crhelper = "^2.0.11"
urllib3 = ">=2.8.0,<3"  # floor clears the open urllib3 advisories (patched in 2.8.0)

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.5"
complexipy = { version = "^9.0.0", python = ">=3.12,<3.16" }  # complexipy supports Python <3.16
boto3-stubs = { extras = ["all"], version = "^1.28.0" }
pytest = ">=7.2.1,<10.0.0"
pytest-cov = ">=4,<8"
pytest-mock = "^3.10.0"
pytest-xdist = "^3.1.0"
black = "26.10.1"
isort = ">=7,<10"
rope = "^1.7.0"
mypy = "^1.13.0"
flake8 = "^7.5.0"
dlint = ">=0.16,<0.18"
flake8-annotations-complexity = "^0.2.0"
flake8-expression-complexity = "^0.1.1"
flake8-functions = ">=0.0.8,<0.1.1"
aws-lambda-typing = "^2.16.3"
safety = ">=2.3.5,<4.0.0"


# License check tooling, installed only by the pylic workflow so that the
# environment it checks contains just runtime dependencies plus pylic itself.
# Run locally the same way CI does, in an environment with nothing else
# installed (e.g. a fresh virtualenv), since pylic checks everything installed:
#   poetry install --only main,license --no-root
#   poetry run pylic check --allow-extra-safe-licenses
[tool.poetry.group.license]
optional = true

[tool.poetry.group.license.dependencies]
pylic = ">=3.4,<7.0"

# Ruff is the primary linter. Rules were migrated from the flake8 plugin stack
# with line-level parity checks; flake8 keeps only pycodestyle (whose whitespace
# rules are preview-only in ruff) and maintained plugins ruff has no equivalent
# for (dlint, flake8-expression-complexity, flake8-annotations-complexity,
# flake8-functions). Cognitive complexity is checked by complexipy.
[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = [
  "F", "C90", "B", "A", "C4", "N", "PT", "ARG", "SIM", "ISC001", "ISC002", "S", "T10", "D", "D417", "ERA", "EXE",
  "TD", "FIX", "T20", "UP031", "UP032", "RSE", "RET", "YTT", "COM818",
  "PTH100", "PTH101", "PTH102", "PTH103", "PTH104", "PTH105", "PTH106", "PTH107", "PTH108", "PTH109",
  "PTH110", "PTH111", "PTH112", "PTH113", "PTH114", "PTH115", "PTH116", "PTH117", "PTH118", "PTH119",
  "PTH120", "PTH121", "PTH122", "PTH123", "PTH124",
]
# translated from .flake8 `ignore`: F401, R506/R508 (flake8-return), B907, T003 (flake8-todos)
ignore = ["F401", "RET506", "RET508", "TD003"]  # B907 has no ruff equivalent

[tool.ruff.lint.pydocstyle]
# D417 (undocumented parameters) is selected explicitly on top of pep257; it covers
# darglint's main check for docstrings that have an Args section.
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"**/inline_lambda.py" = ["D100", "D103"]

[tool.complexipy]
max-complexity-allowed = 15

[tool.black]
line-length = 150

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 150

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
warn_redundant_casts = true
strict_equality = true
show_column_numbers = true
show_error_context = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
namespace_packages = true
no_implicit_optional = false

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
show_missing = true

[tool.coverage.run]
branch = true
omit = ["tests/*"]
source = ["."]

[tool.pytest.ini_options]
addopts = [
 #  "--cov=./",
 "--cov-report=xml",
 "--cov-report=term",
 "--durations=5",
 "--numprocesses=auto",
 "-rA",
 "--ignore-glob=old/*",
]
python_files = ["test_*.py"]
xfail_strict = true

[tool.pyright]
stubPath = "./typings"
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportGeneralTypeIssues = "none"
reportTypedDictNotRequiredAccess = "none"

[tool.pylic]
safe_licenses = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "MIT License",
  "BSD License",
  "Apache Software License",
  "ISC License (ISCL)",
  "PSF-2.0"
]

[tool.vulture]
ignore_decorators = ["@helper.*"]
ignore_names = ["lambda_handler"]
min_confidence = 60
paths = ["aws_sra_examples"]
sort_by_size = true
verbose = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
