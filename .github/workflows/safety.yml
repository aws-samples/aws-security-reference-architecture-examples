name: safety - Python Dependency Check

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

jobs:
  Linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.12]
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Pinned to the Poetry that wrote poetry.lock; bump together with the lock.
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      #----------------------------------------------
      # install dependencies from poetry.lock (main + dev + license, so dev and
      # license-check tools are scanned too)
      #----------------------------------------------
      - name: Install dependencies
        run: |
          poetry install --no-root --with license
      #----------------------------------------------
      # Install the scanner in its own virtualenv from a hash-pinned lock. It is
      # not a project dependency, so its dependencies stay out of poetry.lock and
      # out of the scanned set.
      #----------------------------------------------
      - name: Install Safety
        run: |
          python -m venv "$RUNNER_TEMP/safety"
          "$RUNNER_TEMP/safety/bin/pip" install --quiet --require-hashes --no-deps -r .github/tools/safety/requirements.txt
      #----------------------------------------------
      # Run Safety scan against the project environment. Fails the job on any
      # finding, or if the scan can't run.
      #----------------------------------------------
      - name: Safety scan
        env:
          SAFETY_API_KEY: ${{secrets.SAFETY_API_KEY}}
        run: |
          poetry run pip freeze --all > "$RUNNER_TEMP/project-requirements.txt"
          "$RUNNER_TEMP/safety/bin/safety" check -r "$RUNNER_TEMP/project-requirements.txt" --full-report
