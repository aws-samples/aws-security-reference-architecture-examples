name: safety - Python Dependency Check

on:
  pull_request:
    branches:
      - main
  push:

jobs:
  Linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.12]
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Pinned to the Poetry that wrote poetry.lock; bump together with the lock.
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      #----------------------------------------------
      # install dependencies from poetry.lock (main + dev + license, so dev and
      # license-check tools are scanned and safety itself runs at its locked version)
      #----------------------------------------------
      - name: Install dependencies
        run: |
          poetry install --no-root --with license
      #----------------------------------------------
      # Run Safety scan
      #----------------------------------------------
      - name: Safety scan
        env:
          SAFETY_API_KEY: ${{secrets.SAFETY_API_KEY}}
        run: |
          poetry run safety check
