name: safety - Python Dependency Check

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

jobs:
  # Scans poetry.lock directly: no Poetry and no project code run in this
  # workflow, and only the hash-pinned scanner runs with SAFETY_API_KEY.
  Scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      #----------------------------------------------
      # Install the scanner in its own virtualenv from a hash-pinned lock. It is
      # not a project dependency, so its dependencies stay out of poetry.lock and
      # out of the scanned set.
      #----------------------------------------------
      - name: Install Safety
        run: |
          python -m venv "$RUNNER_TEMP/safety"
          "$RUNNER_TEMP/safety/bin/pip" install --quiet --require-hashes --no-deps -r .github/tools/safety/requirements.txt
      #----------------------------------------------
      # Scan every package in poetry.lock (main, dev and license groups). Fails
      # the job on any finding, if the scan can't run, or if Safety scanned a
      # different number of packages than poetry.lock lists (an empty or
      # unparsed lock otherwise passes with nothing scanned). Time-limited
      # ignores go in .safety-policy.yml.
      #----------------------------------------------
      - name: Safety scan
        shell: bash  # -eo pipefail, so Safety's exit code survives the tee
        env:
          SAFETY_API_KEY: ${{secrets.SAFETY_API_KEY}}
        run: |
          expected=$(grep -c '^\[\[package\]\]' poetry.lock || true)
          "$RUNNER_TEMP/safety/bin/safety" check -r poetry.lock --policy-file .safety-policy.yml --full-report | tee "$RUNNER_TEMP/safety-report.txt"
          scanned=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/safety-report.txt" | grep -oE 'Found and scanned [0-9]+ packages' | grep -oE '[0-9]+' || true)
          if [ "${scanned:-0}" -eq 0 ] || [ "$scanned" != "$expected" ]; then
            echo "::error::Safety scanned ${scanned:-0} of $expected packages in poetry.lock"
            exit 1
          fi
